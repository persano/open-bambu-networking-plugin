name: Publish to OrcaCloud

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Space-separated globs matching the plugin files to upload (.whl / .py).
  PLUGIN_FILES: "*.whl"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "main" ]; then
            version="0.2.8"
          fi
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")"
          if [ -z "$changelog" ]; then
            changelog="Automated release from GitHub"
          fi
          changelog="$(echo "$changelog" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          # --form-string, not -F: -F parses ';' / '<' / '@' inside the value
          # as form attributes and silently truncates the JSON (0.2.22 publish
          # failed with "Metadata must be valid JSON" when the changelog
          # contained "(...); the install ..." ).
          args=(--form-string "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          # The scan gate answers 201 when clean and holds the release for
          # review otherwise (status "held_for_review", e.g. this plugin's
          # ctypes library loading); both mean the upload landed, only the
          # second one waits for a moderator.
          if [ "$status" != "200" ] && [ "$status" != "201" ] && [ "$status" != "202" ]; then
            echo "Publish failed with HTTP $status" >&2
            exit 1
          fi
          scan_status="$(jq -r '.status // "unknown"' response.json 2>/dev/null || echo unknown)"
          if [ "$scan_status" = "held_for_review" ]; then
            echo "::warning::OrcaCloud holds v$version for review: $(jq -r '.scan_summary // ""' response.json)"
          fi
