name: OrcaCloud maintenance

# One off maintenance for the OrcaCloud plugin entry. The publish workflow
# only appends greater versions (the API answers VALIDATION_ERROR for an
# equal or older one), so repairing the changelog of a version that already
# shipped needs a direct call against the release id:
#   probe  -> list the plugin's releases with their OrcaCloud ids
#   patch  -> set the changelog of one release id, using the
#             ORCACLOUD_CHANGELOG.md section for the given version
#   delete -> drop one release id, so the version can be published again

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | patch | delete'
        required: true
        default: 'probe'
      release_id:
        description: 'OrcaCloud release id, required for patch and delete'
        required: false
        default: ''
      version:
        description: 'Version whose ORCACLOUD_CHANGELOG.md section becomes the changelog (patch and repost mode)'
        required: false
        default: ''
      tag:
        description: 'Git tag whose wheels to publish (repost mode)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint OIDC token
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          echo "OIDC_TOKEN=$oidc_token" >> "$GITHUB_ENV"

      - name: Probe releases
        if: inputs.mode == 'probe'
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $OIDC_TOKEN" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases | tee response.json
          echo
          jq -r 'if type == "array" then .[] else .releases[]? end |
                 [(.id // "no-id"), (.version // "?"), (.changelog // "" | length | tostring)] | @tsv' \
            response.json || true

      - name: Patch changelog
        if: inputs.mode == 'patch'
        run: |
          set -euo pipefail
          test -n "${{ inputs.release_id }}"
          test -n "${{ inputs.version }}"
          awk -v pat="## ${{ inputs.version }} " '$0 ~ "^"pat {p=1; next} /^## / {p=0} p {print}' \
            ORCACLOUD_CHANGELOG.md > changelog.md
          test -s changelog.md
          payload="$(jq -n --rawfile changelog changelog.md '{changelog: $changelog}')"
          status="$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.orcaslicer.com/api/v1/plugin-publish/releases/${{ inputs.release_id }}")"
          cat response.json
          echo
          echo "status=$status"
          [ "$status" = "200" ]

      - name: Check out the release tag wheels
        if: inputs.mode == 'repost'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Repost the version with an override flag
        # The publish endpoint rejects an equal or older version outright, so
        # this tries the plausible override flags one by one and stops at the
        # first 201. Every attempt prints the server answer.
        if: inputs.mode == 'repost'
        run: |
          set -euo pipefail
          test -n "${{ inputs.version }}"
          test -n "${{ inputs.tag }}"
          awk -v pat="## ${{ inputs.version }} " '$0 ~ "^"pat {p=1; next} /^## / {p=0} p {print}' \
            ORCACLOUD_CHANGELOG.md > changelog.md
          test -s changelog.md
          args=()
          for file in *.whl; do args+=(-F "files=@$file"); done
          for flag in force update allow_same replace overwrite republish; do
            metadata="$(jq -n --arg version "${{ inputs.version }}" --rawfile changelog changelog.md \
              --arg flag "$flag" '{version: $version, changelog: $changelog} + {($flag): true}')"
            status="$(curl -sS -o response.json -w '%{http_code}' \
              -H "Authorization: Bearer $OIDC_TOKEN" --form-string "metadata=$metadata" \
              "${args[@]}" https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
            echo "flag=$flag status=$status"
            head -c 300 response.json; echo
            if [ "$status" = "201" ]; then
              jq -r '"published version=" + .version + " changelog_len=" + (.changelog | length | tostring)' response.json
              exit 0
            fi
          done
          echo "no override flag was accepted"
          exit 1

      - name: Delete release
        if: inputs.mode == 'delete'
        run: |
          set -euo pipefail
          test -n "${{ inputs.release_id }}"
          status="$(curl -sS -o response.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://api.orcaslicer.com/api/v1/plugin-publish/releases/${{ inputs.release_id }}")"
          cat response.json
          echo
          echo "status=$status"
